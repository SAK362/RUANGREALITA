name: whisper-ruangrealita
# Whisper (WAV per beat -> words.json), lalu render MP4 + voiceover + narasi, diunggah ke GitHub Release job-<id>, lalu callback ke n8n.
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID job (jobs/<job_id>/ berisi job.json dan audio/beat_NN.wav)"
        required: true
      model:
        description: "Model Whisper (small = akurat dan cepat di CPU)"
        required: false
        default: "small"
      callback_url:
        description: "Webhook n8n setelah selesai (opsional)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Cache model Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ inputs.model }}
      - name: Install ffmpeg dan faster-whisper
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg
          pip install faster-whisper
      - name: Jalankan Whisper
        run: python tools/align.py "jobs/${{ inputs.job_id }}" --model "${{ inputs.model }}"
      - name: Kompres audio dan buat bundel kecil
        run: |
          D="jobs/${{ inputs.job_id }}"
          mkdir -p "$D/bundle/audio"
          for f in "$D"/audio/beat_*.wav; do
            b=$(basename "$f" .wav)
            ffmpeg -y -loglevel error -i "$f" -ac 1 -c:a libopus -b:a 32k "$D/bundle/audio/$b.opus"
          done
          cp "$D/job.json" "$D/words.json" "$D/bundle/"
          (cd "$D/bundle" && zip -qr "../bundle_${{ inputs.job_id }}.zip" .)
          rm -rf "$D/bundle"
          ls -la "$D"/bundle_*.zip
      - name: Commit words.json
        run: |
          git config user.name "ruangrealita-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f "jobs/${{ inputs.job_id }}"/heard_*.json "jobs/${{ inputs.job_id }}/words.json" "jobs/${{ inputs.job_id }}/bundle_${{ inputs.job_id }}.zip"
          git commit -m "words ${{ inputs.job_id }}" || echo "tidak ada perubahan"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
  render:
    needs: align
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install ffmpeg dan Playwright
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg zip unzip
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Buka bundel
        run: unzip -oq "jobs/${{ inputs.job_id }}/bundle_${{ inputs.job_id }}.zip" -d "jobs/${{ inputs.job_id }}/"
      - name: Render video 720x1280
        run: |
          mkdir -p out
          node render.js "jobs/${{ inputs.job_id }}/job.json" "out/${{ inputs.job_id }}.mp4" --workers 4 --fps 30 --w 720 --h 1280
          ffprobe -v error -show_entries format=duration -of csv=p=0 "out/${{ inputs.job_id }}.mp4"
      - name: Voiceover dan narasi
        run: |
          ID="${{ inputs.job_id }}"
          ffmpeg -y -loglevel error -i "out/$ID.mp4" -vn -c:a libmp3lame -q:a 3 "out/voiceover_$ID.mp3"
          ffmpeg -y -loglevel error -ss 3 -i "out/$ID.mp4" -frames:v 1 -q:v 3 "out/thumb_$ID.jpg"
          python3 - "$ID" <<'PY'
          import json,sys
          i=sys.argv[1]; j=json.load(open(f"jobs/{i}/job.json",encoding="utf-8"))
          L=[f"{i} | {j.get('title','')}",""]
          sc=j.get("scenes") or []; last=-1
          for b in j["beats"]:
              s=b.get("scene",0)
              if s!=last:
                  last=s; m=sc[s] if s<len(sc) else {}
                  L+=["",f"ADEGAN {s+1} ({m.get('loc','')}) {m.get('ket','')}".rstrip()]
              L.append(f"{b['speaker']}: {b['text']}")
          open(f"out/narasi_{i}.txt","w",encoding="utf-8").write("\n".join(L).strip()+"\n")
          PY
      - name: Unggah ke GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID="${{ inputs.job_id }}"
          gh release delete "job-$ID" -y --cleanup-tag || true
          gh release create "job-$ID" "out/$ID.mp4" "out/voiceover_$ID.mp3" "out/narasi_$ID.txt" "out/thumb_$ID.jpg" \
            --title "job $ID" --notes "Output otomatis RUANGREALITA $ID"
  notify:
    needs: [align, render]
    if: always() && inputs.callback_url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Panggil n8n
        env:
          RESULT: ${{ needs.align.result }}-${{ needs.render.result }}
          CALLBACK_KEY: ${{ secrets.CALLBACK_KEY }}
        run: |
          STATUS=failed; [ "$RESULT" = "success-success" ] && STATUS=success
          curl -sS -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" -H "x-callback-key: ${CALLBACK_KEY}" \
            -d "{\"job_id\":\"${{ inputs.job_id }}\",\"status\":\"${STATUS}\",\"tag\":\"job-${{ inputs.job_id }}\",\"run_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
